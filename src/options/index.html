<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zonely Settings</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <h1>Zonely Settings</h1>
    <p id="status-message" role="status" aria-live="polite"></p>

    <section class="card">
      <h2>Default behavior</h2>
      <p class="hint">What Zonely does on any site with no rule of its own. Rules below take priority.</p>
      <label class="field-label" for="default-mode">Mode</label>
      <select id="default-mode">
        <option value="auto">Auto by IP</option>
        <option value="fixed">Fixed timezone</option>
        <option value="disable">Do not spoof</option>
      </select>
      <label id="default-timezone-label" class="field-label" for="default-timezone" hidden>Timezone</label>
      <select id="default-timezone" hidden></select>
    </section>

    <section class="card">
      <h2>Rules</h2>
      <p class="hint">Mode priority: Tab rule &gt; Rule &gt; Default. Comma separate several patterns. Pick <em>Do not spoof</em> to leave a site alone. Reload affected pages after saving.</p>
      <div class="row">
        <input id="rule-pattern" type="text" placeholder="example.com, *.example.com">
        <select id="rule-mode">
          <option value="auto">Auto by IP</option>
          <option value="disable">Do not spoof</option>
          <option value="fixed">Fixed timezone</option>
        </select>
        <select id="rule-timezone" aria-label="Timezone"></select>
        <button id="add-rule-btn">Save</button>
      </div>
      <ul id="rules-list" class="list"></ul>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
